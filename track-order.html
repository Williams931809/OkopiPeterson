<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Track your order | Maisonpé</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/track-order.css">
  <script defer src="/order-cart.js"></script>
  <script defer src="/track-order.js"></script>
</head>
<body class="tracking-page">
  <main class="tracking-panel">
    <h1>Track your order</h1>
    <form id="track-form">
      <label>Order reference <input name="reference" spellcheck="false" required maxlength="36" autocapitalize="none"></label>
      <label>Checkout email <input name="email" type="email" required maxlength="254" autocomplete="email"></label>
      <button class="cta" type="submit">Track order</button>
    </form>
    <p id="track-message" role="status"></p>
    <section id="order-details" hidden>
      <h2>Order details</h2>
      <p id="order-payment"></p>
      <p id="order-fulfillment"></p>
      <ul id="order-items"></ul>
      <p id="order-total"></p>
      <button id="print-order" type="button">Print order summary</button>
    </section>
    <a class="tracking-back" href="/">Back to store</a>
  </main>
</body>
</html>
