<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Track your order | Maisonpé</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/track-order.css?v=shipment">
  <script defer src="/order-cart.js"></script>
  <script defer src="/track-order.js?v=shipment"></script>
</head>
<body class="tracking-page">
  <div class="tracking-header">
    <a href="/">MAISONPÉ</a>
    <a href="/collection.html">Shop collection</a>
  </div>
  <main class="tracking-panel">
    <section class="tracking-lookup" aria-labelledby="tracking-title">
      <h1 id="tracking-title">Track your order</h1>
      <form id="track-form">
        <label>Order reference <input name="reference" spellcheck="false" required maxlength="36" autocapitalize="none"></label>
        <label>Checkout email <input name="email" type="email" required maxlength="254" autocomplete="email"></label>
        <button type="submit">Track order</button>
      </form>
      <p id="track-message" role="status"></p>
    </section>
    <section id="order-details" aria-labelledby="shipment-title" hidden>
      <div class="shipment-heading">
        <div>
          <p id="order-reference"></p>
          <h2 id="shipment-title" tabindex="-1"></h2>
        </div>
        <time id="shipment-updated" hidden></time>
      </div>
      <ol id="shipment-progress" aria-label="Shipment progress" hidden></ol>
      <p id="order-fulfillment" hidden></p>
      <ul id="order-items" aria-label="Items in this order"></ul>
      <details class="shipment-information">
        <summary>More order details</summary>
        <p id="order-payment"></p>
        <p id="order-total"></p>
        <button id="print-order" type="button">Print order summary</button>
      </details>
      <section id="tracking-recommendations" hidden>
        <h3>You may also like</h3>
        <div id="tracking-products"></div>
      </section>
    </section>
  </main>
</body>
</html>
